# Documentation site (Zensical). Build from this directory:
#
#     zensical build        # into site/
#     zensical serve        # live preview
#
# The Python API reference is generated by mkdocstrings from the stubs in ../build/bindings, so the
# ssqpy target must be built first. The C++ API reference pages are generated into
# docs/cpp-reference/ssqp/ from Doxygen's XML (see Doxyfile), so they must be built first too. Neither
# site/ nor the generated pages are tracked.

[project]
site_name = "SSQP"
site_url = "https://lar.upatras.gr/ssqp/"
site_description = "Structure-exploiting Sequential Quadratic Programming for Optimal Control"
repo_url = "https://github.com/upatras-lar/ssqp"
repo_name = "upatras-lar/ssqp"
copyright = "Copyright &copy; 2025-2026 Nick Karydakis, Konstantinos Chatzilygeroudis and the Laboratory of Automation and Robotics (LAR), University of Patras"
edit_uri = "edit/main/docs/docs/"
dev_addr = "150.140.184.35:8000"
docs_dir = "docs"
site_dir = "site"

extra_css = ["stylesheets/extra.css"]
extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
  "javascripts/benchmark-tolerance.js",
  "javascripts/lar-button.js",
]

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    { "Installation" = "getting-started/installation.md" },
    { "Quickstart" = "getting-started/quickstart.md" },
  ] },
  { "FAQ" = "faq.md" },
  { "Concepts" = [
    { "Model" = "concepts/model.md" },
    { "Costs, Constraints & Dynamics" = "concepts/costs-constraints-dynamics.md" },
    { "Terrain" = "concepts/terrain.md" },
    { "SSQP Solver" = "concepts/solver.md" },
    { "QP Solvers" = "concepts/qp-solvers.md" },
    { "MPC" = "concepts/mpc.md" },
    { "Parameter Search" = "concepts/parameter-search.md" },
  ] },
  { "Examples" = [
    { "Overview" = "examples.md" },
    { "Gallery" = [
      { "Trajectory Generation" = "gallery.md" },
      { "Simulated MPC" = "gallery-simulated-mpc.md" },
      { "Real MPC" = "gallery-real-mpc.md" },
    ] },
    { "Walkthroughs" = [
      { "Pendubot Swing-Up" = "examples/pendubot.md" },
      { "Panda Circle (Trajectory Generation)" = "examples/panda-circle-trajgen.md" },
      { "Go2 Jump" = "examples/go2-jump.md" },
      { "Panda Circle (MPC)" = "examples/panda-circle-mpc.md" },
      { "Go2 Walking (MPC)" = "examples/go2-walking-mpc.md" },
    ] },
  ] },
  { "Benchmarks" = [
    { "Overview" = "benchmarks.md" },
    { "Solver" = "benchmarks-solver.md" },
    { "Solver Modes" = "benchmarks-solver-modes.md" },
  ] },
  # The references nest by module and namespace: a section with an index.md opens that page
  { "Python API Reference" = [
    "reference/index.md",
    { "ssqpy" = [
      "reference/ssqpy/index.md",
      { "model" = [
        "reference/ssqpy/model/index.md",
        { "costs" = "reference/ssqpy/model/costs.md" },
        { "constraints" = "reference/ssqpy/model/constraints.md" },
        { "dynamics" = "reference/ssqpy/model/dynamics.md" },
        { "terrain" = "reference/ssqpy/model/terrain.md" },
      ] },
      { "solvers" = [
        "reference/ssqpy/solvers/index.md",
        { "search" = "reference/ssqpy/solvers/search.md" },
      ] },
    ] },
  ] },
  { "C++ API Reference" = [
    "cpp-reference/index.md",
    { "ssqp" = [
      "cpp-reference/ssqp/index.md",
      { "model" = [
        "cpp-reference/ssqp/model/index.md",
        { "presets" = "cpp-reference/ssqp/model/presets.md" },
        { "stagewise" = [
          "cpp-reference/ssqp/model/stagewise/index.md",
          { "factory" = "cpp-reference/ssqp/model/stagewise/factory.md" },
          { "predefined" = [
            "cpp-reference/ssqp/model/stagewise/predefined/index.md",
            { "constraints" = "cpp-reference/ssqp/model/stagewise/predefined/constraints.md" },
            { "costs" = "cpp-reference/ssqp/model/stagewise/predefined/costs.md" },
          ] },
        ] },
        { "terrain" = [
          "cpp-reference/ssqp/model/terrain/index.md",
          { "predefined" = "cpp-reference/ssqp/model/terrain/predefined.md" },
        ] },
      ] },
      { "param_search" = [
        "cpp-reference/ssqp/param_search/index.md",
        { "dynamics_params" = "cpp-reference/ssqp/param_search/dynamics_params.md" },
      ] },
      { "solvers" = "cpp-reference/ssqp/solvers.md" },
      { "step" = "cpp-reference/ssqp/step.md" },
    ] },
  ] },
]

[project.theme]
language = "en"
logo = "assets/ssqp-mark.svg"
favicon = "assets/ssqp-mark-adaptive.svg"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/upatras-lar/ssqp"

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
admonition = {}
tables = {}
toc.permalink = true
toc.toc_depth = 3
pymdownx.highlight.anchor_linenums = true
pymdownx.superfences = {}
pymdownx.inlinehilite = {}
pymdownx.snippets.base_path = [".."]
pymdownx.snippets.check_paths = true
pymdownx.tabbed.alternate_style = true
pymdownx.arithmatex.generic = true

# {{ ssqp_version }} in the pages, defined in main.py
[project.plugins.macros]

[project.plugins.glightbox]

[project.plugins.mkdocstrings.handlers.python]
paths = ["../build/bindings"]

[project.plugins.mkdocstrings.handlers.python.options]
extensions = ["griffe_extensions.py:DocstringLineBreaks"]
docstring_style = "google"
show_source = false
show_root_heading = true
show_root_full_path = false
merge_init_into_class = true
group_by_category = true
members_order = "source"
show_signature_annotations = false
separate_signature = true
