name: CI

on:
  push:
    branches: [main]
    # Later patterns override earlier ones
    paths: &ci-paths
      - "**"
      # Changes that cannot affect the build or the tests
      - "!**.md"
      - "!docs/**"
      - "!CITATION.cff"
      - "!LICENSE"
      - "!.github/workflows/docs.yml"
      - "!.github/workflows/release.yml"
      - "!.github/scripts/**"
      - "!examples/**"
      # The tests load these URDFs and the python-bindings job runs di.py
      - "examples/assets/urdf/**"
      - "examples/trajgen/python/di.py"
  pull_request:
    paths: *ci-paths

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        with_hpipm: [ON, OFF]
        with_piqp: [ON, OFF]
        piqp_openmp: [OFF]
        # A separate job, since it changes piqp_openmp
        include:
          - with_hpipm: ON
            with_piqp: ON
            piqp_openmp: ON
    name: build-and-test (SSQP_WITH_HPIPM=${{ matrix.with_hpipm }}, SSQP_WITH_PIQP=${{ matrix.with_piqp }}, SSQP_PIQP_OPENMP=${{ matrix.piqp_openmp }})

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git python3-dev python3-numpy \
            libeigen3-dev libboost-filesystem-dev libboost-serialization-dev

      # -march=native bakes the runner CPU into the cached build
      - name: Identify CPU
        id: cpu
        run: |
          grep -m1 '^model name' /proc/cpuinfo
          echo "key=$(grep -e '^model name' -e '^flags' /proc/cpuinfo | sort -u | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # Pinocchio and HPIPM are built from source, which dominates build time
      - name: Cache build directory
        uses: actions/cache@v6.1.0
        with:
          path: build
          key: build-${{ matrix.with_hpipm }}-${{ matrix.with_piqp }}-${{ matrix.piqp_openmp }}-${{ steps.cpu.outputs.key }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}

      - name: Configure
        run: |
          cmake -S . -B build \
            -DSSQP_WITH_HPIPM=${{ matrix.with_hpipm }} \
            -DSSQP_WITH_PIQP=${{ matrix.with_piqp }} \
            -DSSQP_PIQP_OPENMP=${{ matrix.piqp_openmp }} \
            -DSSQP_BUILD_PYTHON=OFF

      - name: Build
        run: cmake --build build --target run_tests -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure -j"$(nproc)"

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-logs-hpipm-${{ matrix.with_hpipm }}-piqp-${{ matrix.with_piqp }}-openmp-${{ matrix.piqp_openmp }}
          path: tests/logs/

  sanitizers:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git \
            libeigen3-dev libboost-filesystem-dev libboost-serialization-dev

      # -march=native bakes the runner CPU into the cached build
      - name: Identify CPU
        id: cpu
        run: |
          grep -m1 '^model name' /proc/cpuinfo
          echo "key=$(grep -e '^model name' -e '^flags' /proc/cpuinfo | sort -u | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache build directory
        uses: actions/cache@v6.1.0
        with:
          path: build
          key: build-sanitized-${{ steps.cpu.outputs.key }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSSQP_ENABLE_SANITIZERS=ON \
            -DSSQP_WITH_HPIPM=ON \
            -DSSQP_WITH_PIQP=ON \
            -DSSQP_BUILD_PYTHON=OFF

      - name: Build
        run: cmake --build build --target run_tests -j"$(nproc)"

      # The finite-difference gradient checks are too slow when instrumented
      - name: Test
        run: ctest --test-dir build --output-on-failure -j"$(nproc)" -E '(cf|lf|gammaf)GradTest'

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-logs-sanitizers
          path: tests/logs/

  python-bindings:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git python3-dev python3-numpy \
            libeigen3-dev libboost-filesystem-dev libboost-serialization-dev

      # -march=native bakes the runner CPU into the cached build
      - name: Identify CPU
        id: cpu
        run: |
          grep -m1 '^model name' /proc/cpuinfo
          echo "key=$(grep -e '^model name' -e '^flags' /proc/cpuinfo | sort -u | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache build directory
        uses: actions/cache@v6.1.0
        with:
          path: build
          key: build-python-${{ steps.cpu.outputs.key }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}

      - name: Configure
        run: |
          cmake -S . -B build \
            -DSSQP_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --target ssqpy -j"$(nproc)"

      - name: Run the double integrator example
        run: PYTHONPATH="$PWD/build/bindings" python3 examples/trajgen/python/di.py
