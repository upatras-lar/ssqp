name: Wheels

# Wheels are built on every release and on manual runs, but only uploaded to
# PyPI for published releases
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-wheels:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      # Settings live in [tool.cibuildwheel] in pyproject.toml
      - uses: pypa/cibuildwheel@v4.3.0

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wheels
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-sdist:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [build-wheels, build-sdist]
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    # Must match the trusted publisher configured on PyPI
    environment:
      name: pypi
      url: https://pypi.org/project/ssqp/
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@v1.14.2
