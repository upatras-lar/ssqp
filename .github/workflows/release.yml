name: Release

# Pushing a v* tag builds the wheels, the sdist and the binary archive,
# creates a GitHub release with all of them and uploads the wheels and sdist
# to PyPI. Manual runs only build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The package version comes from project() in CMakeLists.txt, so a tag that
  # does not match it would release the wrong version
  check-version:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^project(ssqp VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in CMakeLists.txt"
            exit 1
          fi

  build-wheels:
    needs: check-version
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      # Settings live in [tool.cibuildwheel] in pyproject.toml
      - uses: pypa/cibuildwheel@v4.3.0

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wheels
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-sdist:
    needs: check-version
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build-archive:
    needs: check-version
    runs-on: ubuntu-24.04
    # Same image as the wheels, so the archive runs on the same systems
    container: quay.io/pypa/manylinux_2_28_x86_64

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Build archive
        run: bash .github/scripts/build-release-archive.sh . "ssqp-${GITHUB_REF_NAME}-linux-x86_64" archive

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: archive
          path: archive/*.tar.gz
          if-no-files-found: error

  release:
    needs: [build-wheels, build-sdist, build-archive]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes

  publish:
    needs: release
    runs-on: ubuntu-24.04
    # Must match the trusted publisher configured on PyPI
    environment:
      name: pypi
      url: https://pypi.org/project/ssqp/
    permissions:
      id-token: write

    steps:
      # The binary archive is only attached to the GitHub release
      - uses: actions/download-artifact@v8.0.2
        with:
          name: wheels
          path: dist

      - uses: actions/download-artifact@v8.0.2
        with:
          name: sdist
          path: dist

      - uses: pypa/gh-action-pypi-publish@v1.14.2
